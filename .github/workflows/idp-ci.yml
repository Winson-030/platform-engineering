name: IDP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# platformctl.py lint is stdlib-only (PyYAML ships with CPython >=3.11),
# so no pip installs are needed — the gate itself can't break on deps.
jobs:
  lint-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect changed service directories
        id: changed
        run: |
          # Service dirs under services/ touched by this push/PR, excluding
          # intentional non-conforming fixtures (bad-svc*).
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed=$(git diff --name-only "$base" HEAD -- services/ 2>/dev/null \
            | grep -E '^services/' \
            | sed -E 's#^services/([^/]+)/.*#\1#' \
            | sort -u || true)

          if [ -z "$changed" ]; then
            # No valid base (e.g. first push to a new repo): lint every service
            # currently in the tree so the baseline is actually checked.
            changed=$(git ls-files 'services/*' \
              | grep -E '^services/[^/]+/' \
              | sed -E 's#^services/([^/]+)/.*#\1#' \
              | sort -u)
          fi

          # bad-svc* are intentional lint-failure fixtures, not real services.
          changed=$(printf '%s\n' "$changed" | grep -vE '^(bad-svc|bad-svc2)$')

          echo "services: ${changed:-<none>}"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Lint each changed service
        run: |
          set -e
          for svc in ${{ steps.changed.outputs.changed }}; do
            echo "::group::lint services/$svc"
            python3 platformctl.py lint "services/$svc"
            echo "::endgroup::"
          done
